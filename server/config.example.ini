; Modèle de configuration du serveur — copier ce fichier en "config.ini"
; (même dossier) puis renseigner les vraies valeurs.
; "config.ini" ne doit JAMAIS être partagé ni envoyé sur GitHub (voir .gitignore).

[database]
host = 127.0.0.1
port = 5433
dbname = quincaillerie_test
; Le serveur se connecte TOUJOURS avec le rôle applicatif qf_app, jamais avec
; "postgres" : le démarrage refuse explicitement le compte superutilisateur
; (chantier C11 — c'est exactement la faille corrigée au cycle 2).
user = qf_app
password = A_RENSEIGNER_valeur_locale_jamais_commitee

[api]
; Générer une vraie valeur avec :
;   python -c "import secrets; print(secrets.token_hex(32))"
; et la coller ci-dessous — ne jamais garder la valeur d'exemple : le
; démarrage refuse explicitement de partir avec cette valeur.
secret_key = A_GENERER_python_-c_import_secrets_print_secrets.token_hex_32

; Durée de session en minutes. Valeur technique par défaut (8 h, une
; journée de travail) : le réglage définitif ("session inactive : combien de
; temps avant déconnexion ?") reste une question ouverte pour le
; propriétaire — voir ADDENDUM_CAHIER_DES_CHARGES.md, et
; parametres.duree_session_minutes (base) qui vaut encore "a_definir".
duree_session_minutes = 480

; Limitation de débit sur /auth/connexion : nombre maximal de tentatives par
; identifiant, par fenêtre glissante d'une minute. Protection technique
; contre le bourrage de mots de passe, distincte du verrouillage de compte
; (qui, lui, est une règle métier posée en base — voir
; parametres.tentatives_max_connexion).
tentatives_max_par_minute = 10
