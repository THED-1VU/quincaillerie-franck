<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — Quincaillerie Franck</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="simu">Écran câblé sur le serveur réel (cycle 5). Comptes : voir <code>db/tests/00_jeu_essai.sql</code>.</div>
<div class="page">
  <main class="contenu contenu--etroit" style="display:flex; align-items:center; justify-content:center;">
    <div class="carte" style="width:100%; max-width:420px;">
      <h1 style="text-align:center;">Ets Quincaillerie Franck</h1>
      <p style="text-align:center; color:var(--c-texte-doux); margin-bottom:var(--e-5);">Connexion à l'application de gestion</p>

      <form id="form-connexion" novalidate>
        <div class="champ">
          <label class="champ__label" for="identifiant">Identifiant</label>
          <input class="champ__saisie" id="identifiant" name="identifiant" type="text"
                 autocomplete="username" autocapitalize="none" spellcheck="false" autofocus>
        </div>

        <div class="champ">
          <label class="champ__label" for="motdepasse">Mot de passe</label>
          <input class="champ__saisie" id="motdepasse" name="motdepasse" type="password"
                 autocomplete="current-password">
        </div>

        <div id="zone-erreur" class="erreur-champ" hidden></div>

        <button class="btn btn--primaire btn--large" id="bouton-connexion" type="submit" style="margin-top:var(--e-4);">
          Se connecter
        </button>
      </form>

      <p class="champ__aide" style="text-align:center; margin-top:var(--e-5);">
        Mot de passe oublié&nbsp;: prévenez le responsable, il peut le réinitialiser.
      </p>
    </div>
  </main>
</div>

<script src="api.js"></script>
<script>
(function () {
  "use strict";

  // Déjà connecté ? Inutile de repasser par cet écran.
  const session = Session.lire();
  if (session && session.jeton) {
    window.location.href = PAGE_ACCUEIL_PAR_ROLE[session.role] || "vente.html";
    return;
  }

  const form = document.getElementById("form-connexion");
  const zoneErreur = document.getElementById("zone-erreur");
  const boutonConnexion = document.getElementById("bouton-connexion");

  function montrerErreur(message) {
    zoneErreur.textContent = message;
    zoneErreur.hidden = false;
    document.getElementById("motdepasse").focus();
    document.getElementById("motdepasse").select();
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    zoneErreur.hidden = true;
    const identifiant = form.identifiant.value.trim();
    const motDePasse = form.motdepasse.value;

    if (!identifiant && !motDePasse) { montrerErreur("Saisissez votre identifiant et votre mot de passe."); return; }
    if (!identifiant) { montrerErreur("L'identifiant est vide."); document.getElementById("identifiant").focus(); return; }
    if (!motDePasse) { montrerErreur("Le mot de passe est vide."); return; }

    boutonConnexion.disabled = true;
    try {
      const reponse = await fetch("/auth/connexion", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ identifiant, mot_de_passe: motDePasse }),
      });
      const corps = await reponse.json().catch(() => null);

      if (!reponse.ok) {
        // Le serveur renvoie déjà un message clair, en français :
        // "Identifiant ou mot de passe incorrect.", "Ce compte est désactivé...",
        // "Compte verrouillé après plusieurs échecs...", ou (429) "Trop de
        // tentatives de connexion...". On l'affiche tel quel, près du champ.
        montrerErreur((corps && corps.detail) || "Connexion refusée.");
        return;
      }

      Session.enregistrer({
        jeton: corps.jeton,
        utilisateur_id: corps.utilisateur_id,
        nom_complet: corps.nom_complet,
        role: corps.role,
        site_id: corps.site_id,
        doit_changer_mot_de_passe: corps.doit_changer_mot_de_passe,
      });
      window.location.href = PAGE_ACCUEIL_PAR_ROLE[corps.role] || "vente.html";
    } catch {
      montrerErreur(RESEAU_INACCESSIBLE);
    } finally {
      boutonConnexion.disabled = false;
    }
  });
})();
</script>
</body>
</html>
